<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - SkillPath</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card wide">
    <div class="brand">
      <div class="brand-mark">SP</div>
      <div class="brand-name">SkillPath</div>
    </div>
    <p class="auth-subtitle">Create your account and start your career learning journey.</p>

    <!-- REGISTRATION FORM -->
    <form id="registerForm" onsubmit="registerUser(event)">
      <div class="two-col">
        <div class="form-group">
          <label for="fullName">Full Name *</label>
          <input type="text" id="fullName" placeholder="e.g. Bharathi Mohan" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" placeholder="10-digit number" required>
        </div>
        <div class="form-group">
          <label for="role">Role *</label>
          <select id="role" required>
            <option value="">Select role</option>
            <option>Student</option>
            <option>Working Professional</option>
            <option>Job Seeker</option>
            <option>Freelancer</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label for="careerGoal">Career Goal *</label>
          <input type="text" id="careerGoal" placeholder="e.g. Become a Frontend Developer" required>
        </div>
        <div class="form-group">
          <label for="dateOfJoining">Date of Joining *</label>
          <input type="date" id="dateOfJoining" required>
        </div>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" placeholder="At least 6 characters" required>
        </div>
        <div class="form-group">
          <label>Gender *</label>
          <div class="radio-group" style="margin-top:12px;">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
          </div>
        </div>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label for="category">Learning Category *</label>
          <select id="category" required>
            <option value="">Select category</option>
            <option value="Tech">Tech</option>
            <option value="Non-Tech">Non-Tech</option>
            <option value="Hands-On & Creative">Hands-On & Creative</option>
            <option value="Common Skills">Common Skills</option>
            <option value="Communication & Career">Communication & Career</option>
          </select>
        </div>
        <div class="form-group">
          <label for="idNumber">College ID / School ID / Other ID *</label>
          <input type="text" id="idNumber" placeholder="Enter your ID" required>
        </div>
      </div>

      <div class="form-group">
        <label for="profilePhoto">Profile Photo (optional)</label>
        <input type="file" id="profilePhoto" accept="image/*">
      </div>

      <div class="error-text" id="formError"></div>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <!-- SUCCESS MESSAGE (hidden until registration succeeds) -->
    <div id="successMessage" class="success-box" style="display:none;">
      ✓ Registration successful! Redirecting to login...
    </div>

    <div class="auth-footer-links">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
